name: Vue Professional Design Studio
version: 1.0.0
schema: v1

models:
  # Main AI agent
  - name: Gemma 4 26B - Design Engineer
    provider: ollama
    model: gemma4
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
      - image_input
    defaultCompletionOptions:
      temperature: 0.2
      contextLength: 8192
      maxTokens: 4096

  # Fast code completion
  - name: Qwen Coder 7B - Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      temperature: 0.1
      contextLength: 2048
      maxTokens: 256

  # Semantic code search
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text
    apiBase: http://localhost:11434
    roles:
      - embed

# Existing and additional MCP servers
mcpServers:
  # Documentation
  - name: Context7
    command: cmd
    args:
      - /c
      - npx
      - -y
      - "@upstash/context7-mcp@latest"

  # Browser testing
  - name: Playwright
    command: cmd
    args:
      - "/c"
      - "npx"
      - "-y"
      - "@playwright/mcp@latest"

  # Project filesystem
  - name: Filesystem
    command: cmd
    args:
      - /c
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "C:/MyProjects"

  # Vue component registry
  - name: Shadcn Vue
    command: cmd
    args:
      - /c
      - npx
      - -y
      - "@jpisnice/shadcn-ui-mcp-server"
      - "--framework"
      - "vue"

  # Browser inspection and performance
  - name: Chrome DevTools
    command: cmd
    args:
      - /c
      - npx
      - -y
      - "chrome-devtools-mcp@latest"
rules:
  - You are a senior Vue 3 frontend architect.
  - Use Composition API and script setup.
  - Prefer TypeScript when supported.
  - Understand project architecture before coding.
  - Analyze dependencies before modifying components.
  - Reuse existing components and composables.
  - Use Pinia for appropriate shared state.
  - Follow existing Vue Router architecture.
  - Write clean modular and maintainable code.
  - Read and write every file as UTF-8; never let the console code page decide,
    or UTF-8 text comes back as mojibake and gets written back damaged. Run
    `npm run check:encoding` after editing.
