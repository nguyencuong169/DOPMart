<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | DOP Mart</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>
<main class="login-layout">
  <section class="campaign" aria-label="DOP Mart">
    <a class="logo logo--accented" href="index.html" aria-label="DOP Mart – Trang chủ"><svg aria-hidden="true" viewBox="0 0 315 67"><use href="assets/images/dop-mart.svg#accented"/></svg></a>
    <div class="slogan"><span>Shop Happy<svg class="accent-rays" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 5-6m1 11 10-4m-9 11 10 2"/></svg></span><span>Live Colorful.</span></div>
    <div class="perks"><div><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 10 3 11h14l3-11zM6 10l4-7m8 7-4-7m-5 10 1 5m4-5-1 5"/></svg>Đồ ăn &amp; đồ uống<br>tiện lợi</div><div><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" d="M13 2 4 14h7l-1 8 10-13h-8z"/></svg>Giao nhanh<br>trong 2 giờ</div><div><svg class="" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 13 10-10h8l2 9-10 10zM9 16l6-8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="15" r="1"/></svg>Ưu đãi<br>mỗi ngày</div></div>
    <div class="basket" role="img" aria-label="Giỏ sản phẩm DOP Mart"></div>
  </section>
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Đăng nhập <svg class="accent-rays" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 5-6m1 11 10-4m-9 11 10 2"/></svg><br>tài khoản</h1>
    <p>Đăng nhập để mua sắm, theo dõi đơn hàng<br class="desktop-break"> và nhận ưu đãi riêng từ DOP Mart.</p>
    <form id="login">
      <label class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg><input id="identity" autocomplete="username" required aria-label="Email hoặc số điện thoại" placeholder="Email hoặc số điện thoại"></label>
      <label class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" autocomplete="current-password" required aria-label="Mật khẩu" placeholder="Mật khẩu"><button type="button" id="reveal" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12q10-15 20 0-10 15-20 0Z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="m3 3 18 18"/></svg></button></label>
      <div class="options"><label><input type="checkbox" checked> Ghi nhớ đăng nhập</label><button type="button" data-preview="Khôi phục mật khẩu">Quên mật khẩu?</button></div>
      <button class="btn submit">Đăng nhập →</button>
    </form>
    <div class="separator">Hoặc đăng nhập với</div>
    <div class="providers"><button data-preview="Google"><svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#4285f4" d="M44 24.5q0-2-.4-4H24v7.7h11.2q-.8 4.2-4.2 6.4l6.5 5q6.5-6 6.5-15.1Z"/><path fill="#34a853" d="M24 45q8.1 0 13.5-5.4l-6.5-5q-2.7 2-7 2a13 13 0 0 1-12.1-8.9l-6.7 5.2A21 21 0 0 0 24 45Z"/><path fill="#fbbc05" d="M11.9 27.7a13 13 0 0 1 0-7.4l-6.7-5.2a21 21 0 0 0 0 17.8z"/><path fill="#ea4335" d="M24 11.4q4.7 0 8.1 3.2l6-6A20.9 20.9 0 0 0 5.2 15.1l6.7 5.2A13 13 0 0 1 24 11.4Z"/></svg>Google</button><button data-preview="Facebook"><b class="facebook">f</b>Facebook</button><button data-preview="Apple"><svg class="apple" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 2q0 4-4 5 0-4 4-5zm3 6q-4 3 0 7-1 4-4 6-2 0-3-1-2 1-4 1-5-5-5-10 0-6 5-6l4 1q4-2 7 2z"/></svg>Apple</button></div>
    <p id="status" role="status"></p>
    <div class="register">Bạn chưa có tài khoản? <a href="/register">Đăng ký ngay →</a></div>
  </section>
</main><script src="js/bottom-nav.js"></script>
<script src="js/login.js"></script></body></html>
