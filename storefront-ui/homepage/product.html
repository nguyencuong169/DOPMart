<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm | DOP Mart</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/home.css" />
    <link rel="stylesheet" href="css/pages/catalog.css" />
    <link rel="stylesheet" href="css/pages/detail.css">
  </head>

  <body>
    <header class="header">
      <div class="wrap header-inner">
        <button class="icon menu" aria-label="Danh mục">&#9776;</button
        ><a class="logo logo--compact" href="index.html" aria-label="DOP Mart – Trang chủ"
          ><svg aria-hidden="true" viewBox="0 0 257 67">
            <use href="assets/images/dop-mart.svg#compact" /></svg
        ></a>
        <nav class="nav">
          <a href="products.html">Sản phẩm</a><a href="products.html#categories">Danh mục</a
          ><a href="deals.html">Ưu đãi</a
          ><a href="index.html#hero">Về DOP Mart</a>
        </nav>
        <input
          class="search"
          type="search"
          placeholder="Tìm sản phẩm, danh mục, thương hiệu…"
          aria-label="Tìm sản phẩm"
        />
        <div class="actions">
          <button class="icon mobile-search" aria-label="Tìm kiếm">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="10" cy="10" r="7" />
              <path d="m15 15 7 7" />
            </svg></button
          ><button class="icon" id="favorites" aria-label="Yêu thích">♡</button
          ><a class="icon account" href="login.html" aria-label="Tài khoản"
            ><svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="7" r="4" />
              <path d="M3 21q0-8 9-8t9 8z" /></svg></a
          ><button class="icon" id="cart" aria-label="Giỏ hàng">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="19" cy="21" r="1" />
              <path d="M2 3h3l3 13h11l3-10H6" /></svg
            ><sup class="cart-count">0</sup>
          </button>
        </div>
      </div>
    </header>
<main class="wrap detail">
  <section class="gallery" aria-label="Hình ảnh sản phẩm">
    <nav class="thumbs" aria-label="Chọn sản phẩm"></nav>
    <div class="photo"><img id="photo" alt=""></div>
  </section>
  <section class="details">
    <h1 id="name"></h1><p class="detail-price"></p><p id="stock"></p>
    <div class="buy-row">
      <div class="stepper"><button id="less" aria-label="Giảm số lượng">−</button><output id="quantity">1</output><button id="more" aria-label="Tăng số lượng">+</button></div>
      <button class="btn" id="buy">Thêm vào giỏ</button>
      <button id="save" aria-label="Yêu thích"></button>
    </div>
    <div class="sections"><button data-section="description">Mô tả</button><button data-section="info">Thông tin</button><button data-section="reviews">Đánh giá</button></div>
    <p id="copy"></p>
  </section>
</main>
<div class="toast" role="status" hidden></div>
<script src="js/catalog.js"></script><script src="js/cart-badge.js"></script><script src="js/detail.js"></script>
</body></html>
