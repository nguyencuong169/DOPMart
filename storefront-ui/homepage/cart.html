<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Giỏ hàng | DOP Mart</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/pages/cart.css"><link rel="stylesheet" href="css/header.css"></head><body><div class="announcement">Freeship cho đơn từ 199.000đ  |  Ưu đãi mỗi tuần – Khám phá ngay! →</div><header class="store-header" data-page="cart"><script src="js/header.js"></script></header>
<main class="basket-layout">
  <section class="intro"><h1>Giỏ hàng<br><em>của bạn</em></h1><p id="caption"></p></section>
  <section class="items card" aria-label="Giỏ hàng">
    <div class="line headings"><input class="select-all" type="checkbox" aria-label="Chọn tất cả"><b id="row-count"></b><span>Đơn giá</span><span>Số lượng</span><span>Thành tiền</span></div>
    <div id="rows"></div>
    <footer><label><input class="select-all" type="checkbox"> Chọn tất cả</label><button id="remove-selected">Xóa sản phẩm đã chọn</button><a href="index.html">← Tiếp tục mua sắm</a></footer>
  </section>
  <aside class="summary card"><h2>Tóm tắt đơn hàng</h2>
    <dl><dt id="subtotal-label">Tạm tính</dt><dd id="subtotal"></dd><dt>Phí giao hàng</dt><dd id="shipping"></dd><dt class="discount">Ưu đãi vận chuyển</dt><dd class="discount" id="discount"></dd></dl>
    <div class="total"><b>Tổng cộng</b><strong id="total" aria-live="polite"></strong></div>
    <button class="btn pay">Thanh toán →</button>
    <details><summary>Mã giảm giá <small>Chọn / Nhập mã ›</small></summary><label>Nhập mã <input autocomplete="off"></label></details>
    <div class="service"><span>🚚 Giao nhanh<br>   trong 2 giờ</span><span>🛡 Thanh toán<br>   an toàn</span><span>♧ Hỗ trợ<br>   24/7</span></div>
  </aside>
</main><div class="toast" role="status" hidden></div><script src="js/bottom-nav.js"></script>
<script src="js/catalog.js"></script><script src="js/cart-badge.js"></script><script src="js/cart.js"></script></body></html>
